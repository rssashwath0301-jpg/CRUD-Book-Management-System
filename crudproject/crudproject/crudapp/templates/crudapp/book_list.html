<h1>Book Management System</h1>
<a href="{% url 'add_book' %}">Add Book</a>
<table border="1" cellpadding="8">
  <tr><th>Title</th><th>Author</th><th>Price</th><th>Actions</th></tr>
  {% for b in books %}
  <tr>
    <td>{{ b.title }}</td>
    <td>{{ b.author }}</td>
    <td>{{ b.price }}</td>
    <td>
      <a href="{% url 'update_book' b.id %}">Update Price</a>
      <form method="post" action="{% url 'delete_book' b.id %}" style="display:inline">
        {% csrf_token %}
        <button type="submit">Delete</button>
      </form>
    </td>
  </tr>
  {% empty %}
  <tr><td colspan="4">No books yet.</td></tr>
  {% endfor %}
</table>
